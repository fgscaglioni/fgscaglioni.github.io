name: CI

# Portão antes do deploy: o deploy.yml só fazia build, então um teste quebrado
# publicava igual. Este workflow roda build + testes + tipos + paleta em todo
# push para dev e em todo pull request.
#
# Runner e pnpm travados pelo mesmo motivo do deploy.yml: ponteiro móvel
# (ubuntu-latest, pnpm@latest) quebra build que não tocou em nada.

on:
  push:
    branches: [ dev ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Testes
        run: pnpm test
      - name: Tipos
        run: pnpm check
      - name: Paleta
        run: node scripts/check-tokens.mjs
